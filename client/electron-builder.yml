appId: in.looksgoodtomeow.revol
productName: Revol
copyright: Copyright © 2026 Revol

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - electron/dist/**/*
  - package.json

# Auto-update feed — GitHub Releases (Epic 15)
# releaseType: release — publish directly (default "draft" strands the EXE
# in a draft the updater can't see, while the APK job publishes separately)
publish:
  provider: github
  owner: tarinagarwal
  repo: revol
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Revol-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.lifestyle
  artifactName: "Revol-${version}-${arch}.${ext}"

linux:
  target:
    - target: AppImage
  artifactName: "Revol-${version}.${ext}"
